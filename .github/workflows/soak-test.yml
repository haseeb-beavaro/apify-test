name: Apify Soak Test

# Manual trigger = the smoke test (one wiring-check run before the schedule
# is trusted). Scheduled trigger = the actual 3-day, every-12-hour
# reliability monitor (6 cycles over 72h) -- spaced out on purpose, to catch
# failures that only show up after hours of running rather than sampling
# densely early and exhausting budget before day 3. Both run the exact same
# script/command.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */12 * * *"

permissions:
  contents: write

concurrency:
  group: apify-soak-test
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run soak-test monitoring cycle
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python soak_test.py

      - name: Commit results
        run: |
          git config user.name "soak-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/soak_test/
          git diff --cached --quiet && exit 0
          git commit -m "Soak test run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
